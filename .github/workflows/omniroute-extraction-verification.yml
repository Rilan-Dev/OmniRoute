name: OmniRoute Extraction Verification

on:
  workflow_dispatch:
  push:
    branches:
      - extraction/omniroute-platform-core

jobs:
  verify-extraction-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extraction tooling
        uses: actions/checkout@v4
        with:
          ref: extraction/omniroute-platform-core
          fetch-depth: 0

      - name: Create exact pinned source worktree
        run: |
          git fetch --no-tags origin 453918ab64f147604576e72d33e2bbfc12b2d1af
          git worktree add --detach ../omniroute-source 453918ab64f147604576e72d33e2bbfc12b2d1af
          test "$(git -C ../omniroute-source rev-parse HEAD)" = "453918ab64f147604576e72d33e2bbfc12b2d1af"
          test "$(git -C ../omniroute-source rev-parse HEAD^{tree})" = "76f3546d48a7293b199b7571d13808bebadb6d1f"

      - name: Execute Phase 1 and Phase 7 evidence collection
        run: |
          node extraction/omniroute-platform-core/verification/phase1-closure-scanner.mjs ../omniroute-source extraction/omniroute-platform-core/verification/phase1-closure-report.json
          node extraction/omniroute-platform-core/verification/phase1-supplemental-closure-analyzer.mjs ../omniroute-source extraction/omniroute-platform-core/verification/phase1-supplemental-report.json
          node extraction/omniroute-platform-core/verification/phase1-closure-mapper.mjs ../omniroute-source extraction/omniroute-platform-core/verification/phase1-closure-map.json
          node extraction/omniroute-platform-core/verification/phase7-second-pass.mjs ../omniroute-source extraction/omniroute-platform-core/verification/phase7-second-pass.json
          node extraction/omniroute-platform-core/verification/phase7-reconciliation.mjs extraction/omniroute-platform-core/verification/phase7-second-pass.json extraction/omniroute-platform-core/verification/phase7-reconciliation.json
          node extraction/omniroute-platform-core/verification/phase1-gate.mjs             extraction/omniroute-platform-core/verification/phase1-closure-report.json             extraction/omniroute-platform-core/verification/phase1-supplemental-report.json             extraction/omniroute-platform-core/verification/phase1-closure-map.json             extraction/omniroute-platform-core/verification/phase7-second-pass.json             extraction/omniroute-platform-core/verification/phase7-reconciliation.json             extraction/omniroute-platform-core/verification/phase1-gate.json
          node extraction/omniroute-platform-core/verification/extraction-integrity-verifier.mjs ../omniroute-source extraction/omniroute-platform-core/omniroute-source extraction/omniroute-platform-core/verification/extraction-integrity-report.json

      - name: Upload raw verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-extraction-verification-reports
          path: extraction/omniroute-platform-core/verification/*.json
          if-no-files-found: error
